name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: dist/ matches the TypeScript source
        run: git diff --exit-code dist/
      - name: server loads on Node
        run: |
          out=$(node dist/server.js 2>&1 || true)
          echo "$out" | grep -q 'missing required env var'
